name: Test and publish Pocket Lab
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: HTTP regression tests
        run: python3 tests/test_lab.py
      - name: Build the actual amd64 image
        run: docker build -t pocket-lab:ci .
      - name: Start isolated test container
        run: |
          docker run -d --name pocket-ci --read-only --tmpfs /tmp:size=32m --cap-drop ALL --security-opt no-new-privileges --pids-limit 96 --memory 256m -p 127.0.0.1:18080:8080 pocket-lab:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then exit 0; fi
            sleep 1
          done
          docker logs pocket-ci
          exit 1
      - name: Repeat HTTP tests against the running container
        env:
          LAB_TEST_URL: http://127.0.0.1:18080
        run: |
          python3 tests/test_lab.py
          test "$(docker exec pocket-ci id -u)" = 10001
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs pocket-ci || true
          docker rm -f pocket-ci || true
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish amd64 and arm64 (no RUN steps, no emulation required)
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${REPO,,}"
          docker buildx create --name pocket-builder --driver docker-container --use
          TAGS=(-t "$IMAGE:sha-${GITHUB_SHA:0:12}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAGS+=(-t "$IMAGE:${REF_NAME#v}")
          else
            TAGS+=(-t "$IMAGE:latest" -t "$IMAGE:1.0.0")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 "${TAGS[@]}" --label "org.opencontainers.image.revision=$GITHUB_SHA" --push .
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull $IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
